function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dayKey(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function start(mode,pool=activeSet.words,review=false){S={mode,pool:shuffle(pool),i:0,c:0,w:0,answered:false,review};hide();document.getElementById("quiz").classList.remove("hidden");render()}

function grams(s){
 s=(s||"").toLowerCase().replace(/\s+/g,"").replace(/[\/,()\-–—]/g,"");
 let g=new Set();
 for(let n=1;n<=2;n++) for(let i=0;i<=s.length-n;i++) g.add(s.slice(i,i+n));
 return g;
}
function sim(a,b){
 let A=grams(a),B=grams(b),hit=0;
 A.forEach(x=>{if(B.has(x))hit++});
 return hit/Math.max(1,Math.sqrt(A.size*B.size));
}
function hardDistractors(w){
 let candidates=activeSet.words.filter(x=>x.zh!==w.zh);
 let scored=candidates.map(x=>{
   // Make distractors deliberately confusable:
   // similar pinyin/sound, Chinese characters, or Thai wording/meaning.
   let p=sim(w.py,x.py), z=sim(w.zh,x.zh), t=sim(w.th,x.th);
   let score;
   if(S.mode==="zh-th"){
     // Chinese prompt: prioritize similar Chinese/pinyin so Thai choices come from confusable Chinese words.
     score=p*0.52+z*0.30+t*0.18;
   }else{
     // Thai prompt: prioritize similar Thai meanings, then similar Chinese/pinyin.
     score=t*0.48+p*0.30+z*0.22;
   }
   // Small bonus for same first/last character or similar answer length.
   if(w.zh[0] && x.zh[0]===w.zh[0]) score+=0.13;
   if(w.zh.slice(-1) && x.zh.slice(-1)===w.zh.slice(-1)) score+=0.10;
   if(Math.abs((w.th||"").length-(x.th||"").length)<=3) score+=0.04;
   return {x,score};
 }).sort((a,b)=>b.score-a.score);
 // Randomize within the hardest top candidates so repeated practice is not predictable.
 let top=scored.slice(0,Math.min(8,scored.length));
 let first=top.splice(Math.floor(Math.random()*Math.min(4,top.length)),1)[0];
 let second=top.splice(Math.floor(Math.random()*Math.min(5,top.length)),1)[0];
 return [first,second].filter(Boolean).map(v=>v.x);
}

function render(){

 q.className="question"+(S.mode==="th-zh"?" thai":"");q.textContent=S.mode==="zh-th"?w.zh:w.th;
 document.getElementById("qmode").textContent=S.review?"🔁 ทบทวนคำที่เคยผิด":(S.mode==="zh-th"?"🇨🇳 จีน → ไทย":"🇹🇭 ไทย → จีน");

 let choices=shuffle([w,...hardDistractors(w)]);
 o.innerHTML="";choices.forEach((x,i)=>{let b=document.createElement("button");b.className="opt";b.dataset.zh=x.zh;b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${S.mode==="zh-th"?x.th:x.zh}`;b.onclick=()=>answer(b,x);o.appendChild(b)});topbar()
}
function answer(btn,x){if(S.answered)return;S.answered=true;let ok=x.zh===S.cur.zh;ok?S.c++:S.w++;document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.zh===S.cur.zh)b.classList.add("good")});if(!ok)btn.classList.add("bad");document.getElementById("feedback").innerHTML=(ok?"✅ ถูกต้อง":"❌ ยังไม่ใช่")+`<br>${S.cur.zh} <span class="py">${S.cur.py}</span> = ${S.cur.th}`;record(ok);document.getElementById("next").classList.remove("hidden");topbar()}
function record(ok){let x=store(),d=dayKey(),sid=activeSet.id;if(!x.days[d])x.days[d]={};if(!x.days[d][sid])x.days[d][sid]={answered:0,correct:0,wrong:0,modes:{"zh-th":{answered:0,correct:0},"th-zh":{answered:0,correct:0}}};let z=x.days[d][sid];z.answered++;ok?z.correct++:z.wrong++;z.modes[S.mode].answered++;if(ok)z.modes[S.mode].correct++;let k=sid+"|"+S.cur.zh;if(!x.words[k])x.words[k]={correct:0,wrong:0};ok?x.words[k].correct++:x.words[k].wrong++;save(x)}

function showHistory(filter){hide();document.getElementById("history").classList.remove("hidden");document.getElementById("histTitle").textContent=filter?`📊 ${SETS.find(s=>s.id===filter).name}`:"📊 ประวัติทั้งหมด";document.getElementById("histBack").onclick=filter?()=>openSet(filter):home;let x=store(),rows=[],ta=0,tc=0;Object.entries(x.days).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([d,sets])=>{Object.entries(sets).forEach(([sid,v])=>{if(filter&&sid!==filter)return;let set=SETS.find(s=>s.id===sid);if(!set)return;ta+=v.answered;tc+=v.correct;rows.push({d,set,v})})});document.getElementById("totalA").textContent=ta;document.getElementById("totalC").textContent=tc;document.getElementById("acc").textContent=ta?Math.round(tc/ta*100)+"%":"0%";document.getElementById("historyRows").innerHTML=rows.length?rows.map(r=>{let [y,m,d]=r.d.split("-"),v=r.v;return `<div class="row"><b>📅 ${d}/${m}/${y} • ${r.set.name}</b><div>ทำ ${v.answered} • ✅ ${v.correct} • ❌ ${v.wrong} • ${Math.round(v.correct/v.answered*100)}%</div><div class="muted">จีน→ไทย ${v.modes["zh-th"].correct}/${v.modes["zh-th"].answered} • ไทย→จีน ${v.modes["th-zh"].correct}/${v.modes["th-zh"].answered}</div></div>`}).join(""):`<div class="empty">ยังไม่มีประวัติการฝึก 🐼</div>`}
function exportData(){let b=new Blob([localStorage.getItem(KEY)||'{"days":{},"words":{}}'],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="chinese-quiz-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){let f=e.target.files[0];if(!f)return,r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.days||!x.words)throw 0;save(x);alert("นำเข้าประวัติเรียบร้อย ✅");showAllHistory()}catch(_){alert("ไฟล์สำรองไม่ถูกต้อง")}};r.readAsText(f)}
function clearData(){if(confirm("ล้างประวัติทั้งหมดจริงไหม? ถ้ายังไม่ได้สำรองจะกู้คืนไม่ได้")){localStorage.removeItem(KEY);showAllHistory()}}
</script></body></html>
